<main class="subpage deals-page"><section class="subpage-hero"><p class="eyebrow">REWARDS & BENEFITS</p><h1>Make every order count.</h1><p>Unlock perks designed for your next Bengaluru delivery.</p></section><section class="deal-grid"><article class="deal-card" *ngFor="let deal of deals"><div class="deal-icon">★</div><span class="deal-label">{{ deal.label }}</span><h2>{{ deal.title }}</h2><p>{{ deal.copy }}</p><button type="button" (click)="redeem(deal)">{{ deal.redeemed ? 'Redeemed' : 'Add to cart' }}</button></article></section></main>
