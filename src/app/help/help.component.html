<main class="subpage help-page"><section class="subpage-hero"><p class="eyebrow">SUPPORT CENTRE</p><h1>How can we help?</h1><p>Quick answers for orders, payments, and your account.</p></section><section class="help-layout"><aside><strong>Help topics</strong><button type="button">FAQs</button><button type="button">General issues</button><button type="button">Payments</button><button type="button">Partner onboarding</button><button type="button">Legal</button></aside><section class="faq-panel"><h2>Frequently asked questions</h2><article class="faq-item" *ngFor="let topic of topics" (click)="topic.open = !topic.open"><button type="button"><span>{{ topic.title }}</span><strong>{{ topic.open ? '−' : '+' }}</strong></button><p *ngIf="topic.open">{{ topic.answer }}</p><small *ngIf="!topic.open">{{ topic.summary }}</small></article></section></section></main>
