<main class="auth-page"><section class="auth-card"><div class="auth-brand-mark">S</div><p class="auth-kicker">{{ registerMode ? 'JOIN SWIGGY' : 'WELCOME BACK' }}</p><h1>{{ registerMode ? 'Create your account' : 'Log in to Swiggy' }}</h1><p class="auth-copy">Order from Bengaluru's best restaurants in a few taps.</p><div class="auth-tabs" role="tablist"><button type="button" [class.active]="!registerMode" (click)="toggleMode(false)">Login</button><button type="button" [class.active]="registerMode" (click)="toggleMode(true)">Sign Up</button></div><div class="success-banner" *ngIf="successMessage">{{ successMessage }}<span *ngIf="otpVisible"> Enter the OTP sent to your mobile to continue.</span></div><form *ngIf="!registerMode" class="auth-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate><label><span>Mobile number</span><input type="tel" formControlName="phone" placeholder="10-digit mobile number" /><small *ngIf="loginPhone.touched && loginPhone.invalid">Please enter a valid 10-digit mobile number.</small></label><button class="auth-submit" type="submit" [disabled]="loginForm.invalid">Continue</button></form><form *ngIf="registerMode" class="auth-form" [formGroup]="signupForm" (ngSubmit)="submit()" novalidate><label><span>Full name</span><input formControlName="name" placeholder="Enter your name" /><small *ngIf="name.touched && name.invalid">Name must be at least 3 characters.</small></label><label><span>Email address</span><input type="email" formControlName="email" placeholder="you@example.com" /><small *ngIf="email.touched && email.invalid">Please enter a valid email address.</small></label><label><span>Mobile number</span><input type="tel" formControlName="phone" placeholder="10-digit mobile number" /><small *ngIf="signupPhone.touched && signupPhone.invalid">Please enter a valid 10-digit mobile number.</small></label><label><span>Password</span><input type="password" formControlName="password" placeholder="Minimum 6 characters" /><small *ngIf="password.touched && password.invalid">Password must be at least 6 characters.</small></label><label><span>Confirm password</span><input type="password" formControlName="confirmPassword" placeholder="Repeat your password" /><small *ngIf="confirmPassword.touched && confirmPassword.hasError('passwordMismatch')">Passwords do not match.</small></label><label><span>Referral code <em>Optional</em></span><input formControlName="referralCode" placeholder="Enter referral code" /></label><button class="auth-submit" type="submit" [disabled]="signupForm.invalid">Create account</button></form></section></main>
