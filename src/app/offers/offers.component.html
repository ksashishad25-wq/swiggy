<main class="subpage offers-page"><section class="offers-hero"><p class="eyebrow">OFFERS FOR YOU</p><h1>More food. More value.</h1><p>Fresh savings on your favourite Bengaluru restaurants.</p></section><section class="promo-grid"><article class="promo-card" *ngFor="let offer of offers"><span class="offer-badge">{{ offer.tag }}</span><h2>{{ offer.title }}</h2><p>{{ offer.copy }}</p><div class="promo-code">{{ offer.code }}</div><div class="promo-footer"><strong>SWIGGY</strong><button type="button" (click)="claim(offer)">{{ offer.claimed ? 'COPIED!' : 'COPY CODE' }}</button></div></article></section></main>
